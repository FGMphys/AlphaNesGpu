# STAF training input (example). Run: python staf_train.py input_staf.yaml

# Floating-point precision for TF + CUDA ops.
# Options: float | float32 | double | float64 (aliases: fp32/fp64).
# Selects ops_float or ops_double (build with: bash install_path.sh all).
precision: float

# Multi-GPU distribution (same repo; select mode here only).
# Options: none | horovod
#   none     — single device (default if omitted)
#   horovod  — MPI ranks × 1 GPU (same- or multi-node); launch with mpirun
#              YAML learning rates are not auto-scaled; train buffers are sharded.
# MirroredStrategy was removed; use horovod for multi-GPU.
distribute: none

# Dataset root (expects train/ and test/ with .npy frames).
dataset_folder: /leonardo_work/IscrB_NNPWATER/ALPHAGPU_2/dataset

# Frames kept in host memory for descriptor streaming (test / train).
buffer_stream_dim_ts: 4
buffer_stream_dim_tr: 4

# How often to save training loss / checkpoints (in batches).
displ_freq: 10
# Optional: host log of per-batch losses / lr (default = displ_freq). Lower = more sync.
# log_batch_freq: 10

# Subsample frames. Options: 'no'  |  Ntrain Ntest  (e.g. 40 10)
subsampling: 'no'

# Output model folder name prefix.
model_name: 'model_log'

# Restart mode.
# Options: 'no' | 'all_params' | 'only_afs' | 'from_last' | <modelname>
#   no          — fresh run
#   all_params  — load AFs + NN weights (not optimizer state)
#   only_afs    — load AFs only (needs afs_param_folder)
#   from_last   — resume params + optimizer from second-last model_name* folder
#   <modelname> — load from that folder name
restart: 'no'
# Required for restart: only_afs | all_params
afs_param_folder: '/leonardo_work/IscrB_NNPWATER/ALPHAGPU_2/afsparam_2'

# Descriptor cutoffs (Å) and neighbor buffers (must be ≥ max neighbors or run aborts).
Rc: 4.5                 # radial cutoff
Rs: 2.25                # short-range / repulsive radial scale
Rc_Angular: 4.5         # angular cutoff
Radial_Buffer: 55       # max neighbors within Rc
Max_Angular_Neigh: 55   # max neighbors within Rc_Angular

# Atomic fingerprint (AF) channel maps: species → counts per partner species.
# e.g. 0: [10,10] → type-0 atom has 10 radial AFs to type 0 and 10 to type 1.
map_rad_afs: {0: [10,10],1: [10,10]}
map_ang_afs: {0: [20,20,20],1: [20,20,20]}

# Dense decoder MLP.
number_of_decoding_layers: 2
number_of_decoding_nodes: 240 240   # one integer per hidden layer
number_of_epochs: 6000
activation_function: tanh          # e.g. tanh
alpha_bound: 5.                    # clip bound for AF parameters

# Mini-batch sizes (train / validation).
batch_size: 4
batch_size_test: 1

# Loss weights and recipe.
loss_energy_prefactor: 1.
loss_force_prefactor: 1.
# Virial loss weight (used only with energy+force+virial). Labels: total eV, shape (n,9).
loss_virial_prefactor: 1.
# Options: energy | energy+force | energy+force+virial
type_of_training: energy+force
# Options: huber | MSE  (validation always uses MSE)
loss_method: huber

# Validate every N epochs.
freq_test: 4

# Learning-rate schedules (net MLP / physics+AF params).
# Options:
#   expdec  initial_lr  final_lr
#   cosann  initial_lr  first_decay_step  t_mul  m_mul  alpha
#lr_dense_net: cosann 0.001 3000 1.4 0.9 0.0000001
#lr_phys_net:  cosann 0.001 3000 1.4 0.9 0.0000001
lr_dense_net: expdec 0.001 0.0000001
lr_phys_net:  expdec 0.001 0.0000001

# Optimizers (typically adam).
optimizer_net: adam
optimizer_phys: adam

# RNG seed (GPU vs CPU may still differ at the same seed).
Seed: 0
